
services:
  app:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 80s
    environment:
      MONGO_CONNECTION_STRING: ${MONGO_CONNECTION_STRING:?Set MONGO_CONNECTION_STRING in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API: ${OPENAI_API:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-nano}
      ANALYSES_PER_MINUTE: ${ANALYSES_PER_MINUTE:-10}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(res => process.exit(res.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
